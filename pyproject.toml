[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: requires a live Postgres+TimescaleDB (docker-compose up db)",
    "live_llm: makes a real Anthropic API call (needs ANTHROPIC_API_KEY + credit balance); skips cleanly otherwise",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
